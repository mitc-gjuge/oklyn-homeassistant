name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run pytest
        run: pytest

  hassfest:
    name: Validate (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate (HACS)
    runs-on: ubuntu-latest
    # La validation HACS s'appuie sur l'API GitHub (topics, contenu du dépôt) et
    # n'aboutit que sur un dépôt PUBLIC (sur un dépôt privé certains sous-checks
    # renvoient « None »). On saute donc le job tant que le dépôt est privé : il
    # s'activera automatiquement, en tant que vrai check, au passage en public.
    if: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # L'icône/logo de marque vit dans le dépôt home-assistant/brands,
          # absent ici : on ignore cette vérification.
          ignore: brands
